[project]
name = "terrawatch-ml"
version = "0.1.0"
description = "ML prediction service for TerraWatch — Prophet-based time-series forecasting for fires and rainfall"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "prophet>=1.1.6",
    "scikit-learn>=1.6.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "minio>=7.2.0",
    "python-dotenv>=1.0.0",
]
