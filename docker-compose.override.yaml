services:
  postgis_db:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: terrawatch

  minio_bucket:
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9000:9000"
      - "9001:9001"

  go_backend:
    environment:
      - DB_HOST=postgis_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=terrawatch
      - DB_PORT=5432

  react_frontend:
    build:
      args:
        - VITE_API_URL=http://localhost:8080

networks:
  proxy:
    external: false
    name: terrawatch-dev
